model_list:
  # === Anthropic Claude ===
  - model_name: anthropic/claude-opus-4-6
    litellm_params:
      model: anthropic/claude-opus-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
      rpm: 50
      tpm: 200000
    model_info:
      input_cost_per_token: 0.000015
      output_cost_per_token: 0.000075

  - model_name: anthropic/claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
      rpm: 100
      tpm: 400000
    model_info:
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015

  # === OpenAI (API Key) ===
  - model_name: openai/gpt-4.1
    litellm_params:
      model: openai/gpt-4.1
      api_key: os.environ/OPENAI_API_KEY
      rpm: 500
      tpm: 800000

  - model_name: openai/o3
    litellm_params:
      model: openai/o3
      api_key: os.environ/OPENAI_API_KEY
      rpm: 100

  # === OpenAI Codex (OAuth, Responses API) ===
  - model_name: openai/gpt-5.2-codex
    litellm_params:
      model: openai/gpt-5.2-codex
      rpm: 60
    model_info:
      input_cost_per_token: 0.00000175
      output_cost_per_token: 0.000014

  - model_name: openai/gpt-5.1-codex
    litellm_params:
      model: openai/gpt-5.1-codex
      rpm: 60
    model_info:
      input_cost_per_token: 0.00000125
      output_cost_per_token: 0.00001

  # === Google Gemini (Vertex AI) ===
  - model_name: gemini/gemini-2.5-pro
    litellm_params:
      model: vertex_ai/gemini-2.5-pro
      vertex_project: os.environ/GCP_PROJECT
      vertex_location: us-central1
      vertex_credentials: os.environ/GOOGLE_APPLICATION_CREDENTIALS
      rpm: 1000
      tpm: 4000000

  - model_name: gemini/gemini-2.5-flash
    litellm_params:
      model: vertex_ai/gemini-2.5-flash
      vertex_project: os.environ/GCP_PROJECT
      vertex_location: us-central1
      vertex_credentials: os.environ/GOOGLE_APPLICATION_CREDENTIALS
      rpm: 2000

  # === DeepSeek ===
  - model_name: deepseek/deepseek-chat
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
      rpm: 300

  - model_name: deepseek/deepseek-reasoner
    litellm_params:
      model: deepseek/deepseek-reasoner
      api_key: os.environ/DEEPSEEK_API_KEY
      rpm: 100

  # === Groq ===
  - model_name: groq/llama-3.3-70b-versatile
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
      rpm: 30

  # === xAI ===
  - model_name: xai/grok-3
    litellm_params:
      model: xai/grok-3
      api_key: os.environ/XAI_API_KEY
      rpm: 60

  # === Ollama (Local) ===
  - model_name: ollama/qwen2.5-coder:32b
    litellm_params:
      model: ollama/qwen2.5-coder:32b
      api_base: http://localhost:11434
    model_info:
      input_cost_per_token: 0
      output_cost_per_token: 0

litellm_settings:
  fallbacks:
    - anthropic/claude-opus-4-6: [deepseek/deepseek-reasoner, openai/o3]
    - anthropic/claude-sonnet-4-6: [openai/gpt-4.1, gemini/gemini-2.5-flash]
    - openai/gpt-5.2-codex: [openai/gpt-5.1-codex, anthropic/claude-sonnet-4-6]
    - gemini/gemini-2.5-pro: [anthropic/claude-sonnet-4-6]

  default_fallbacks: [deepseek/deepseek-chat, openai/gpt-5.2-codex, ollama/qwen2.5-coder:32b]

  context_window_fallbacks:
    - anthropic/claude-sonnet-4-6: [gemini/gemini-2.5-pro]

  num_retries: 2
  request_timeout: 120
  drop_params: true

router_settings:
  routing_strategy: simple-shuffle
  enable_pre_call_checks: true
  num_retries: 2
  cooldown_time: 30

  retry_policy:
    AuthenticationErrorRetries: 0
    TimeoutErrorRetries: 3
    RateLimitErrorRetries: 5
    BadRequestErrorRetries: 0
    InternalServerErrorRetries: 2

  allowed_fails_policy:
    AuthenticationErrorAllowedFails: 0
    RateLimitErrorAllowedFails: 10
    TimeoutErrorAllowedFails: 5
    BadRequestErrorAllowedFails: 1000
